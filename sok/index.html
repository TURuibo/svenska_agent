<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sök — 查词字典 · svensk_agent</title>
    <link rel="stylesheet" href="../styles.css?v=3" />
    <link rel="stylesheet" href="sok.css?v=4" />
  </head>
  <body data-site="sok">
    <main class="palette">
      <header class="paletteHead">
        <p class="eyebrow">svensk_agent</p>
        <h1>Sök <span class="brandSub">查词字典</span></h1>
        <div class="searchWrap">
          <input id="searchInput" type="search" autocomplete="off" autofocus
                 placeholder="搜索词、词组、句子、语法、链接…" aria-label="Search the knowledge base" />
          <span class="kbHint"><span class="kbd">/</span></span>
        </div>
        <nav id="typePills" class="typePills" aria-label="Filter by note type"></nav>
        <p id="statLine" class="statLine"></p>
      </header>

      <!-- results list (shown only while searching) -->
      <p id="resultCount" hidden></p>
      <div id="results" class="results" aria-label="Search results" hidden></div>

      <!-- selected note (full width) -->
      <article id="note" class="note detailContent" aria-label="Selected note" hidden></article>

      <!-- empty / idle hint -->
      <div id="emptyHint" class="emptyHint">
        <p class="big">开始输入以搜索知识库</p>
        <p id="emptyCount"></p>
      </div>
    </main>

    <script src="../kb-index.js?v=4"></script>
    <script src="../kb-markdown.js?v=4"></script>
    <script src="../kb-store.js?v=5"></script>
    <script src="../speak.js?v=1"></script>
    <script src="app.js?v=5"></script>
    <script src="../nav.js?v=2"></script>
  </body>
</html>
