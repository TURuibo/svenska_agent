name: Update KB web viewer

on:
  push:
    branches: [main]
    paths:
      - 'knowledge_base/**'
      - 'site/**'
      - 'tools/build-kb-site.js'
      - 'tools/build-kb-site.ps1'
      - '.github/workflows/kb-site.yml'
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kb-site
  cancel-in-progress: true

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate KB viewer data
        run: node tools/build-kb-site.js

      - name: Commit refreshed viewer data if needed
        run: |
          if git diff --quiet -- site/kb-data.js; then
            echo "site/kb-data.js is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/kb-data.js
            git commit -m "Update KB viewer data"
            git push
          fi

      - name: Publish site folder to gh-pages
        run: |
          sha=$(git subtree split --prefix site HEAD)
          git push origin "$sha:refs/heads/gh-pages" --force
