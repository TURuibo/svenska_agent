name: Update KB web viewer

on:
  push:
    branches: [main]
    paths:
      - 'knowledge_base/**'
      - 'imported/**'
      - 'listening/**'
      - 'site/**'
      - 'tools/build-kb-site.js'
      - 'tools/build-reading-site.js'
      - 'tools/build-listening-site.js'
      - '.github/workflows/kb-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kb-site
  cancel-in-progress: true

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The viewer data files (kb-data.js, reading-data.js, listening-data.js)
      # are .gitignore'd on main and exist ONLY here — regenerated fresh on every
      # publish. They are never committed back to main, so routines never fight
      # the CI over them (eliminates the old "Update KB viewer data" churn).
      - name: Regenerate viewer data (KB + Läsning + Lyssna)
        run: |
          node tools/build-kb-site.js
          node tools/build-reading-site.js
          node tools/build-listening-site.js

      - name: Publish site folder to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-add the gitignored data files into an EPHEMERAL commit used only
          # to build the gh-pages tree. This commit lives and dies on the runner —
          # it is never pushed to main (we only push the subtree split to gh-pages).
          git add -f site/kb-index.js site/kb-bodies.js site/reading/reading-data.js site/listening/listening-data.js
          git commit -q -m "ci: ephemeral build data for gh-pages" || echo "no data changes to stage"
          sha=$(git subtree split --prefix site HEAD)
          git push origin "$sha:refs/heads/gh-pages" --force
