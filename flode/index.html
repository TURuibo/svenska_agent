<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flöde — 刷瑞典语 · svensk_agent</title>
    <meta name="description" content="碎片时间刷瑞典语：词卡、选择题、填空、盲听、新闻一口……" />
    <meta name="theme-color" content="#f7f8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flöde" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="../styles.css?v=4" />
    <link rel="stylesheet" href="flode.css?v=1" />
  </head>
  <body class="flBody" data-site="flode">
    <header class="flTop" id="flTop">
      <a class="flTopBtn" href="../" title="回 Dagbok" aria-label="回 Dagbok">📅</a>
      <div class="flGoal" id="flGoal" title="今日目标">
        <div class="flGoalBar"><span id="flGoalFill"></span></div>
        <span class="flGoalTxt" id="flGoalTxt">0/30</span>
        <span class="flStreak" id="flStreak">🔥 0</span>
      </div>
      <button type="button" class="flTopBtn" id="flGear" title="设置" aria-label="设置" aria-haspopup="dialog">⚙︎</button>
    </header>

    <main class="flFeed" id="flFeed" aria-label="卡片流"></main>

    <div class="flSheetWrap" id="flSheetWrap" hidden>
      <div class="flSheetBack" data-close="1"></div>
      <section class="flSheet" role="dialog" aria-modal="true" aria-labelledby="flSheetTitle">
        <header class="flSheetHead">
          <h2 id="flSheetTitle">⚙︎ 设置</h2>
          <button type="button" class="flSheetX" data-close="1" aria-label="关闭">✕</button>
        </header>
        <div class="flSet">
          <span class="flSetLabel">每日目标</span>
          <div class="flSeg" id="flGoalSeg" role="radiogroup" aria-label="每日目标">
            <button type="button" data-goal="15" role="radio">15 张</button>
            <button type="button" data-goal="30" role="radio">30 张</button>
            <button type="button" data-goal="60" role="radio">60 张</button>
          </div>
        </div>
        <label class="flSet flSetRow">
          <span class="flSetLabel">自动朗读<small>词卡 · 词组 · 一句话进入时自动读（盲听卡总会自动读）</small></span>
          <input type="checkbox" id="flAuto" class="flSwitch" />
        </label>
        <div class="flSet">
          <span class="flSetLabel">语速 <b id="flRateVal">0.85×</b></span>
          <div class="flSetRow">
            <input type="range" id="flRate" min="0.6" max="1.1" step="0.05" value="0.85" aria-label="语速" />
            <button type="button" class="flMini" id="flRateTry" aria-label="试听">🔊</button>
          </div>
        </div>
        <label class="flSet flSetRow">
          <span class="flSetLabel">答题震动</span>
          <input type="checkbox" id="flVib" class="flSwitch" />
        </label>
        <div class="flSet flSetRow">
          <span class="flSetLabel">已静音的词 <b id="flMuteN">0</b><small>点过「😎 会了」的词不再出词卡</small></span>
          <button type="button" class="flMini" id="flUnmute">清空静音</button>
        </div>
        <p class="flSetInfo" id="flInfo"></p>
      </section>
    </div>

    <div class="flToast" id="flToast" role="status" aria-live="polite"></div>

    <script src="flode-data.js"></script>
    <script src="../speak.js?v=3"></script>
    <script src="flode.js?v=1"></script>
    <script>
      window.addEventListener('load', function () {
        try {
          if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
        } catch (_e) { /* silent */ }
      });
    </script>
  </body>
</html>
