<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Läsning — Swedish Reading</title>
    <link rel="stylesheet" href="../styles.css?v=2" />
    <link rel="stylesheet" href="reading.css?v=11" />
    <link rel="stylesheet" href="../kb-popover.css?v=4" />
  </head>
  <body class="readingBody" data-site="reading">
    <header class="readingHeader">
      <div class="readingHeaderInner">
        <div class="readingBrand">
          <p class="eyebrow">svensk_agent</p>
          <h1>Läsning <span class="brandSub">情景 / 文章阅读</span></h1>
          <p id="readingUpdated" class="updated">Loading…</p>
        </div>
      </div>

      <nav class="filterBar" aria-label="Filters">
        <span class="filterLabel">类型：</span>
        <button type="button" class="kindFilter active" data-kind="all">全部</button>
        <button type="button" class="kindFilter" data-kind="scenario">情景练习</button>
        <button type="button" class="kindFilter" data-kind="news">新闻</button>
        <button type="button" class="kindFilter" data-kind="article">文章</button>
        <button type="button" class="kindFilter" data-kind="adjsubst">词形变化</button>
        <span class="filterDivider" aria-hidden="true"></span>
        <button type="button" id="filterUnread" class="toggleBtn" title="只看未读">📖 未读</button>
        <button type="button" id="toggleVocab" class="toggleBtn" title="高亮 KB 里有的瑞典语生词，点词查看释义">🔤 生词</button>
        <button type="button" id="toggleLookup" class="toggleBtn" title="开启后可点正文里没链接、但其实 KB 已有的词，搜索并建立永久链接">🔍 查词</button>
        <button type="button" id="openLearnQueue" class="toggleBtn" title="KB 里还没有的词，攒成一条 /learn 命令回 Claude Code 真正查词入库">📥 想学</button>
        <span class="filterDivider" aria-hidden="true"></span>
        <label class="readingSearch">
          <input id="readingSearchInput" type="search" autocomplete="off" placeholder="搜索标题 / 正文…" />
        </label>
      </nav>
    </header>

    <main class="readingMain">
      <section id="articleList" class="articleList" aria-label="Article list">
        <p class="listLoading">加载中…</p>
      </section>
      <article id="articleView" class="articleView" aria-label="Reading pane">
        <p class="viewEmpty">← 从左侧选择一篇阅读</p>
      </article>
    </main>

    <script src="reading-data.js"></script>
    <script src="../kb-index.js?v=4"></script>
    <script src="../kb-markdown.js?v=4"></script>
    <script src="../kb-store.js?v=5"></script>
    <script src="reading.js?v=12"></script>
    <script src="../nav.js?v=2"></script>
  </body>
</html>
