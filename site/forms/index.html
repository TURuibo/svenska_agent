<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Former — 词形变化 by 词性</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="forms.css" />
  </head>
  <body class="formsBody">
    <header class="formsHeader">
      <div class="formsBar">
        <div class="formsBrand">
          <h1>Former <span class="brandSub">词形变化</span></h1>
          <span id="formsUpdated" class="updated">Loading…</span>
        </div>
        <label class="formsSearch">
          <input id="formsSearch" type="search" autocomplete="off" placeholder="🔍 筛选 词 / 词形 / 意思…  ( / )" />
        </label>
        <div class="formsGroup" role="group" aria-label="分组方式">
          <span class="groupLabel">分组</span>
          <button type="button" class="groupBtn" data-group="class" title="按词性分组">词性</button>
          <button type="button" class="groupBtn active" data-group="date" title="按录入日期 + 来源分组">日期</button>
        </div>
        <div class="formsSort">
          <button type="button" class="sortBtn active" data-sort="new" title="最新在前">最新</button>
          <button type="button" class="sortBtn" data-sort="old" title="最早在前">最早</button>
          <button type="button" class="sortBtn" data-sort="alpha" title="按字母">A–Ö</button>
        </div>
        <nav class="formsNav" aria-label="Site nav">
          <a class="navLink" href="../" title="Search KB">🔍</a>
          <a class="navLink" href="../recap/" title="Dagbok">📅</a>
          <button type="button" id="chipToggle" class="navLink" title="显示/隐藏词性导航">词性 ▾</button>
        </nav>
      </div>
      <nav id="classFilters" class="classFilters" aria-label="按词性跳转"></nav>
    </header>

    <main id="formsMain" class="formsMain">
      <p class="formsLoading">加载中…</p>
    </main>

    <script src="../kb-data.js"></script>
    <script src="../reading/reading-data.js"></script>
    <script src="forms.js"></script>
  </body>
</html>
